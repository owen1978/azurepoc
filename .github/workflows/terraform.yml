name: Terraform

# Runs on every push to main, or manually from the Actions tab.
# (No pull_request trigger: the Branch federated credential only matches main.)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing gets write access by default; each job asks for what it needs.
permissions:
  contents: read

# Only one run at a time, so two runs never fight over the state lock.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ---------------------------------------------------------------
  # 1. Checks: format, validate, security scan. No Azure login at all.
  # ---------------------------------------------------------------
  checks:
    name: Checks (fmt, validate, Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8 # change to match `terraform version` on your PC
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true # report findings, don't block (tighten later)

  # ---------------------------------------------------------------
  # 2. Plan: logs in to Azure via OIDC (Branch credential: main).
  #    No environment, so no approval needed.
  # ---------------------------------------------------------------
  plan:
    name: Terraform plan
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets this job request the OIDC token
      contents: read
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 7

  # ---------------------------------------------------------------
  # 3. Apply: waits for your approval (required reviewer on the
  #    "azure" environment), then applies the exact plan from job 2.
  #    Logs in via the Environment credential: azure.
  # ---------------------------------------------------------------
  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      id-token: write
      contents: read
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply tfplan